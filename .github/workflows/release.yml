name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  release:
    name: Build and publish release
    needs: verify
    runs-on: sprinters:aws:ubuntu-24.04:m7a.xlarge:temp=gp3/24/max/max:spot=rerun
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release bundles
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            bundle="vamos_${version}_${os}_${arch}"
            stage="dist/${bundle}"
            mkdir -p "${stage}"
            mise exec -- go run ./cmd/build -version "${version}" -os "${os}" -arch "${arch}" -out "${stage}"
            cp README.md "${stage}/README.md"
            if [ "${os}" = "windows" ]; then
              (cd dist && zip -rq "${bundle}.zip" "${bundle}")
            else
              tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
            fi
            rm -rf "${stage}"
          done

          (cd dist && sha256sum vamos_* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/vamos_*
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          flags=(--generate-notes --verify-tag)
          if [[ "${version}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${tag}" dist/vamos_* dist/SHA256SUMS "${flags[@]}"
