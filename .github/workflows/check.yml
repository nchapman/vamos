name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Client checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run check
        shell: bash
