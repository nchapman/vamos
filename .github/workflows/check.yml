name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Client checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run check
        shell: bash

  python-tests:
    name: Example and integration-driver unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s integration -p 'test_*.py' -v
      - run: python3 -m unittest discover -v
        working-directory: examples/journal
      - run: python3 -m unittest discover -s tests -v
        working-directory: examples/ledger
