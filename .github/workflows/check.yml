name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Client checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - sprinters:aws:ubuntu-24.04:m7a.xlarge:temp=gp3/24/max/max:spot=rerun
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - if: runner.os != 'Windows'
        run: mise run check
        shell: bash
      - if: runner.os == 'Windows'
        run: |
          mise run fmt-check
          mise run mod-check
          mise run vet
          mise exec -- go build ./cmd/vamos
          mise exec -- go list ./... | grep -vE '/internal/(agent|backup|backupbackend|deploy|executor|volumes)$' | xargs mise exec -- go test
        shell: bash

  lint:
    name: Lint and cross-OS vet
    runs-on: sprinters:aws:ubuntu-24.04:m7a.xlarge:temp=gp3/24/max/max:spot=rerun
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: |
          GOOS=linux GOARCH=arm64 mise exec -- go vet ./...
          GOOS=windows GOARCH=amd64 mise exec -- go vet ./...
          GOOS=darwin GOARCH=arm64 mise exec -- go vet ./...
        shell: bash

  python-tests:
    name: Example and integration-driver unit tests
    runs-on: sprinters:aws:ubuntu-24.04:m7a.xlarge:temp=gp3/24/max/max:spot=rerun
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s integration -p 'test_*.py' -v
      - run: python3 -m unittest discover -s integration/repository -p 'test_*.py' -v
      - run: python3 -m unittest discover -s docker/caddy -p 'test_*.py' -v
      - run: python3 -m unittest discover -v
        working-directory: examples/journal
      - run: python3 -m unittest discover -s tests -v
        working-directory: examples/ledger
