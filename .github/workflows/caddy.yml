name: Caddy Ingress Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/caddy/**"
      - ".github/workflows/caddy.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ghcr.io/nchapman/vamos/caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Caddy image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --push \
            -t ghcr.io/nchapman/vamos/caddy:2.11.9 \
            docker/caddy
