app: ledger
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env:
      HOST: db
      DB: ledger
      USER: ledger
    secrets:
      PASSWORD: database-password
    http:
      port: 8080
      health: /readyz
  db:
    image: postgres:17
    update: manual
    env:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
    secrets:
      POSTGRES_PASSWORD: database-password
    volume:
      name: data
      mount: /var/lib/postgresql/data
