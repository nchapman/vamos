app: ledger
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    secrets:
      DATABASE_URL: database-url
    http:
      port: 8080
      health: /readyz
      domains:
        - api.ledger.example.com
  db:
    image: postgres:17
    update: manual
    env:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
    secrets:
      POSTGRES_PASSWORD: database-password
    volumes:
      - name: postgres
        mount: /var/lib/postgresql/data
