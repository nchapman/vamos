<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Vamos</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1520; color: #eef6ff; }
    main { max-width: 42rem; padding: 3rem; }
    .label { color: #77d8b0; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(3rem, 9vw, 5rem); line-height: 1.05; letter-spacing: -.06em; margin: 1rem 0; }
    p { font-size: 1.15rem; line-height: 1.7; color: #adbed0; }
    code { color: #eef6ff; }
  </style>
</head>
<body>
  <main>
    <div class="label">Dockerfile → server → HTTPS</div>
    <h1>Hello from Vamos.</h1>
    <p>A tiny app, built on its own server and served through Caddy.
       No registry, scheduler, or custom daemon required.</p>
    <p>Readiness endpoint: <code>/healthz</code></p>
  </main>
</body>
</html>
