app: journal
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env:
      DATABASE_PATH: /data/journal.sqlite
      UPLOAD_PATH: /data/uploads
    secrets:
      SESSION_SECRET: session-secret
    volumes:
      - name: data
        mount: /data
    http:
      port: 8080
      health: /readyz
      domains:
        - journal.example.com
