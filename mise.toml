[tools]
go = "1.27.1"

[env]
# Keep Go's automatic toolchain downloader from overriding the mise pin.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build the client and bundled Linux host executors"
depends = ["build:host-amd64", "build:host-arm64"]
run = "go build -trimpath -o bin/ ./cmd/soar"

[tasks."build:host-amd64"]
description = "Build the Linux amd64 host executor"
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/soar-linux-amd64 ./cmd/soar"

[tasks."build:host-arm64"]
description = "Build the Linux arm64 host executor"
env = { GOOS = "linux", GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/soar-linux-arm64 ./cmd/soar"

[tasks.check]
description = "Check formatting, vet, run the full race-enabled test suite, and build"
depends = ["fmt-check", "vet", "test", "build"]

[tasks.deps]
description = "Download Go module dependencies from go.mod/go.sum"
run = "go mod download"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal integration/orbstack"

[tasks.fmt-check]
description = "Check Go formatting without changing files"
shell = "bash -c"
run = '''
set -eu
files=$(gofmt -l cmd internal integration/orbstack)
if [ -n "$files" ]; then
  printf 'Run mise run fmt for:\n%s\n' "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run all tests with race detection"
run = "go test -race ./..."

[tasks."test:integration"]
description = "Create an isolated OrbStack Linux machine, run checks and integration tests, then destroy it (macOS)"
run = "go run ./integration/orbstack"

[tasks."test:python"]
description = "Run fast integration-driver and example Python tests (requires Python 3)"
run = '''
python3 -m unittest discover -s integration -p 'test_*.py' -v
(cd examples/journal && python3 -m unittest discover -v)
(cd examples/ledger && python3 -m unittest discover -s tests -v)
'''

[tasks."test:visual"]
description = "Test the visual harness and capture production CLI fixtures in installed Chrome"
dir = "integration/visual"
run = '''
npm ci --ignore-scripts
npm test
npm run capture
'''
