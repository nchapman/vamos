[tools]
go = "1.27.4"

[env]
# Keep Go's automatic toolchain downloader from overriding the mise pin.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build a matching versioned client and Linux executor bundle"
run = "go run ./cmd/build"

[tasks.check]
description = "Check formatting and module metadata, vet, run race-enabled tests, and build"
depends = ["fmt-check", "mod-check", "vet", "test", "build"]

[tasks.deps]
description = "Download Go module dependencies from go.mod/go.sum"
run = "go mod download"

[tasks.fmt]
description = "Format Go source"
run = "sh integration/gofmt.sh -w"

[tasks.fmt-check]
description = "Check Go formatting without changing files"
shell = "bash -c"
run = '''
set -eu
files=$(sh integration/gofmt.sh -l)
if [ -n "$files" ]; then
  printf 'Run mise run fmt for:\n%s\n' "$files"
  exit 1
fi
'''

[tasks.mod-check]
description = "Check that go.mod and go.sum are tidy without changing them"
run = "go mod tidy -diff"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint (requires golangci-lint)"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run all tests with race detection"
run = "go test -race ./..."

[tasks."test:integration"]
description = "Create an isolated OrbStack Linux machine, run checks and integration tests, then destroy it (macOS)"
run = "go run ./integration/orbstack"

[tasks."test:python"]
description = "Run fast integration-driver and example Python tests (requires Python 3)"
run = '''
python3 -m unittest discover -s integration -p 'test_*.py' -v
python3 -m unittest discover -s integration/repository -p 'test_*.py' -v
python3 -m unittest discover -s docker/caddy -p 'test_*.py' -v
(cd examples/journal && python3 -m unittest discover -v)
(cd examples/ledger && python3 -m unittest discover -s tests -v)
'''

[tasks."test:visual"]
description = "Test the visual harness and capture production CLI fixtures in installed Chrome"
dir = "integration/visual"
run = '''
npm ci --ignore-scripts
npm test
npm run capture
'''
